<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>人生倒數 • Life Countdown</title>
  <style>
    :root{
      --bg-light: #f6f9fc;
      --card-light: #ffffff;
      --text-light: #0b1220;
      --muted-light: #556077;

      --bg-dark:#0f1724;
      --card-dark:#0b1220cc;
      --text-dark:#e6eef8;
      --muted-dark:#9aa4b2;

      --accent1:#7c5cff;
      --accent2:#00d4ff;
      --glass-radius:16px;
      --radius:12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;padding:28px;background:linear-gradient(160deg,var(--bg-dark),#071022);color:var(--text-dark)}

    @media (prefers-color-scheme: light){
      body{background:linear-gradient(160deg,var(--bg-light),#e9f2fb);color:var(--text-light)}
    }

    .card{
      width:980px;max-width:100%;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));backdrop-filter: blur(6px);
      border-radius:var(--glass-radius);padding:20px;border:1px solid rgba(255,255,255,0.04);box-shadow:0 10px 30px rgba(2,6,23,0.45);
      display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;box-sizing:border-box
    }
    @media (max-width:880px){.card{grid-template-columns:1fr;padding:16px}}

    .left h1{font-size:22px;margin:4px 0}
    .left p{margin:6px 0 16px 0;color:var(--muted-dark);}
    @media (prefers-color-scheme: light){.left p{color:var(--muted-light)}}

    .controls{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
    .controls input[type=date]{appearance:none;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;min-width:160px}
    .controls input[type=number]{appearance:none;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;min-width:100px}

    .stats{display:flex;gap:12px;flex-wrap:wrap}
    .stat{flex:1;min-width:120px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
    .stat .num{font-size:18px;font-weight:800}
    .stat .label{color:var(--muted-dark);font-size:12px;margin-top:6px}
    @media (prefers-color-scheme: light){.stat{border-color:rgba(10,20,40,0.04)}.stat .label{color:var(--muted-light)}}

    .progress-wrap{margin-top:12px}
    .progress-label{display:flex;justify-content:space-between;align-items:center}
    .progress-label .perc{font-weight:800;font-size:18px}

    .bar{margin-top:8px;height:18px;border-radius:12px;background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));overflow:hidden;border:1px solid rgba(255,255,255,0.02)}
    .bar > .fill{height:100%;width:0%;border-radius:12px;background:linear-gradient(90deg,var(--accent1),var(--accent2));box-shadow:0 6px 18px rgba(124,92,255,0.18);transition:width 0.8s cubic-bezier(.4,0,.2,1)}

    .right{display:flex;flex-direction:column;gap:12px;align-items:center}
    .circle{width:200px;height:200px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid rgba(255,255,255,0.03);background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02))}
    .circle svg{position:absolute;left:0;top:0}
    .circle .center{z-index:2;text-align:center}
    .center .big{font-size:26px;font-weight:800}
    .center .sub{color:var(--muted-dark);font-size:13px}
    @media (prefers-color-scheme: light){.circle{border-color:rgba(10,20,40,0.04)}.center .sub{color:var(--muted-light)}}

    .footer-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
    .btn-ghost{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;cursor:pointer}

    /* 剩餘天數完成閃動動畫 */
    @keyframes flashArc {
      0%,100% { stroke-opacity: 1; }
      50% { stroke-opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="left">
      <h1>修行剩餘天數試算 — 目標年齡【<span id="dynamicAgeTitle"></span>】</h1>
      <p>可動態調整出生日期與目標年齡，可使用"複製分享連結"</p>

      <div class="controls">
        <input id="birthdate" type="date" aria-label="出生日期" />
        <input id="targetAge" type="number" min="1" max="200" placeholder="目標年齡（例如 60）" aria-label="目標年齡" />
        <button id="copyBtn" class="btn-ghost">複製分享連結</button>
      </div>

      <div class="stats" id="stats">
        <div class="stat">
          <div class="num" id="currentAge">--</div>
          <div class="label">目前年齡（歲）</div>
        </div>
        <div class="stat">
          <div class="num" id="daysLived">--</div>
          <div class="label">人生已過天數</div>
        </div>
        <div class="stat">
          <div class="num" id="daysLeft">--</div>
          <div class="label">修行剩餘天數（到 <span id="dynamicAgeTitle_3"></span>）</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-label"><div>人生進度百分比（到 <span id="dynamicAgeTitle_2"></span>）</div><div class="perc" id="percText">--%</div></div>
        <div class="bar"><div class="fill" id="barFill"></div></div>
      </div>
    </div>

    <div class="right">
      <div class="circle" role="img" aria-label="人生進度圓形顯示">
        <svg width="200" height="200" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0" x2="1">
              <stop offset="0%" stop-color="var(--accent1)" />
              <stop offset="100%" stop-color="var(--accent2)" />
            </linearGradient>
          </defs>
          <circle cx="110" cy="110" r="96" stroke="rgba(255,255,255,0.04)" stroke-width="12" fill="none" />
          <circle id="arc" cx="110" cy="110" r="96" stroke="url(#g1)" stroke-width="12" stroke-linecap="round" fill="none" transform="rotate(-90 110 110)" stroke-dasharray="603.19" stroke-dashoffset="603.19" />
        </svg>
        <div class="center">
          <div class="big" id="percBig">--%</div>
          <div class="sub" id="ageSub">到目標歲數還有 -- 天</div>
        </div>
      </div>

      <div class="footer-actions">
        <button id="resetBtn" class="btn-ghost">重置</button>
      </div>
    </div>
  </div>

  <script>
    const qs = s => document.querySelector(s);
    const daysBetween = (a,b) => Math.floor((b - a) / (1000*60*60*24));

    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
    function parseQuery(){ const u = new URL(location.href); return { b: u.searchParams.get('b'), age: u.searchParams.get('age') }; }
    function getTargetAge(){ const el = qs('#targetAge'); if(!el) return 60; const v = parseInt(el.value,10); if(!v||v<=0) return 60; return Math.min(200, Math.max(1, v)); }

    function compute(birthDate){
      const now = new Date();
      const birth = new Date(birthDate.getFullYear(), birthDate.getMonth(), birthDate.getDate());
      const targetAge = getTargetAge();
      const end = new Date(birth.getFullYear() + targetAge, birth.getMonth(), birth.getDate());
      const totalDays = Math.max(1, daysBetween(birth, end));
      const livedDays = daysBetween(birth, now);
      const leftDays = daysBetween(now, end);
      const ageYears = (now - birth) / (1000*60*60*24*365.2425);
      const usedPercent = clamp((livedDays / totalDays) * 100, 0, 100);
      return {totalDays, livedDays: Math.max(0,livedDays), leftDays: Math.max(0,leftDays), ageYears, usedPercent, end, targetAge}
    }

    function animateTo(percent,leftDays){
      const fill = qs('#barFill');
      const arc = qs('#arc');
      const percText = qs('#percText');
      const percBig = qs('#percBig');
      const ageSub = qs('#ageSub');
      const p = clamp(percent,0,100);

      if(fill) fill.style.width = p + '%';

      const circumference = 2*Math.PI*96;
      const startOffset = circumference;
      const targetOffset = circumference*(1 - p/100);
      const duration = 1000;
      const startTime = performance.now();

      function tick(t){
        const dt = Math.min(1,(t-startTime)/duration);
        const eased = dt<0.5?4*dt*dt*dt:1-Math.pow(-2*dt+2,3)/2;
        const offset = startOffset + (targetOffset-startOffset)*eased;
        if(arc) arc.setAttribute('stroke-dashoffset', offset);

        const valPercent = p*eased;
        const valDays = Math.round(leftDays*eased);
        if(percText) percText.textContent = percBig.textContent = Math.round(valPercent*100)/100 + '%';
        if(ageSub) ageSub.textContent = leftDays > 0
          ? ('到 ' + getTargetAge() + ' 歲還有 ' + valDays.toLocaleString() + ' 天')
          : ('已超過 ' + getTargetAge() + ' 歲');
        if(dt<1) requestAnimationFrame(tick);
        else{
          // 動畫完成後閃動提示
          if(arc){
            arc.style.animation = 'flashArc 0.6s ease-in-out 2';
            setTimeout(()=>{arc.style.animation='';},1200);
          }
        }
      }
      requestAnimationFrame(tick);
    }

    function updateUIFromBirth(d){
      const out = compute(d);
      qs('#currentAge').textContent = Math.floor(out.ageYears) + ' 歲';
      qs('#daysLived').textContent = out.livedDays.toLocaleString() + ' 天';
      qs('#daysLeft').textContent = out.leftDays.toLocaleString()+ ' 天';
      ['#dynamicAgeTitle','#dynamicAgeTitle_2','#dynamicAgeTitle_3'].forEach(id=>{
        const el = qs(id);
        if(el) el.textContent = out.targetAge + ' 歲';
      });
      animateTo(out.usedPercent,out.leftDays);
    }

    function debounce(fn, delay){ let timer; return function(...args){ clearTimeout(timer); timer = setTimeout(()=>fn.apply(this,args), delay); } }

    document.addEventListener('DOMContentLoaded',()=>{
      const dateInput = qs('#birthdate');
      const targetAgeInput = qs('#targetAge');
      const copyBtn = qs('#copyBtn');
      const resetBtn = qs('#resetBtn');

      const q = parseQuery();
      if(q.b){ const d = new Date(q.b); if(!isNaN(d)) dateInput.value = d.toISOString().slice(0,10); }
      if(q.age && targetAgeInput){ const av = parseInt(q.age,10); if(!isNaN(av)) targetAgeInput.value = av; }

      if(!dateInput.value) dateInput.value = '1996-03-02';
      if(targetAgeInput && !targetAgeInput.value) targetAgeInput.value = '60';

      const autoCompute = debounce(()=>{
        const d = new Date(dateInput.value);
        if(!isNaN(d)) updateUIFromBirth(d);
        const u = new URL(location.href);
        if(dateInput.value) u.searchParams.set('b', dateInput.value);
        if(targetAgeInput && targetAgeInput.value) u.searchParams.set('age', targetAgeInput.value);
        history.replaceState({},'',u.toString());
      },300);

      [dateInput,targetAgeInput].forEach(el=>{ if(el) el.addEventListener('input', autoCompute); });

      // 初次載入
      updateUIFromBirth(new Date(dateInput.value));

      copyBtn.addEventListener('click', async ()=>{
        const u = new URL(location.href);
        try{
          await navigator.clipboard.writeText(u.toString());
          copyBtn.textContent = '已複製 ✓';
          setTimeout(()=>copyBtn.textContent='複製分享連結',1400);
        }catch(e){ prompt('無法直接複製，請手動複製以下連結：', u.toString()); }
      });

      resetBtn.addEventListener('click', ()=>{
        dateInput.value = '1996-03-02';
        if(targetAgeInput) targetAgeInput.value = '60';
        updateUIFromBirth(new Date(dateInput.value));
        history.replaceState({},'', location.pathname);
      });
    });
  </script>
</body>
</html>
